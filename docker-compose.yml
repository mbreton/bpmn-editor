# Coolify (type « Docker Compose ») : le proxy de Coolify joint le conteneur sur son port interne 3000,
# aucun port n'est publié sur l'hôte (évite les conflits avec un autre service déjà sur 3000).
# En local : docker compose -f docker-compose.yml -f docker-compose.local.yml up -d  → http://localhost:3000
services:
  bpmn-editor:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD requis}
      GIT_REMOTE_URL: ${GIT_REMOTE_URL:-}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - bpmn-data:/data

volumes:
  bpmn-data:
